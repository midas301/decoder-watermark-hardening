name: Experiment
description: A pre-registered experiment (fill before running)
labels: ["type:experiment", "status:triage"]
body:
  - type: textarea
    id: hypothesis
    attributes: {label: Hypothesis, description: "State it so it can fail"}
    validations: {required: true}
  - type: textarea
    id: design
    attributes: {label: Design, description: "Variants (D0_matched/D1/D2/D3), attack grid, budgets, seeds, split, config file"}
    validations: {required: true}
  - type: textarea
    id: metrics
    attributes: {label: Metrics and acceptance, description: "Score threshold, PSNR/SSIM/LPIPS/FID gates, detected fraction, stats test"}
    validations: {required: true}
  - type: textarea
    id: cost
    attributes: {label: Compute estimate, description: "CPU/GPU hours, device"}
  - type: textarea
    id: outcome
    attributes: {label: Outcome (fill after), description: "Link to reports/ output. Include failures."}
