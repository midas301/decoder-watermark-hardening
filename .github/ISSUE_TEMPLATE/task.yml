name: Task / feature
description: A unit of implementation work
labels: ["type:task", "status:triage"]
body:
  - type: textarea
    id: goal
    attributes: {label: Goal, description: What and why}
    validations: {required: true}
  - type: textarea
    id: ac
    attributes: {label: Acceptance criteria, value: "- [ ] \n- [ ] "}
    validations: {required: true}
  - type: dropdown
    id: workstream
    attributes: {label: Workstream, options: [P1 Eval/infra, P2 Decoder fine-tune, P3 Image attacks, P4 Quality/defense/analysis, Cross-cutting]}
  - type: textarea
    id: deps
    attributes: {label: Dependencies / blocked by}
