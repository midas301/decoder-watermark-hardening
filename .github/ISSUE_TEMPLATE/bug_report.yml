name: Bug
description: Something is wrong or irreproducible
labels: ["type:bug", "status:triage"]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: Expected vs actual}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Reproduce, description: "Config, command, git SHA, device"}
    validations: {required: true}
  - type: textarea
    id: impact
    attributes: {label: Impact on results, description: "Does this invalidate any reported numbers?"}
