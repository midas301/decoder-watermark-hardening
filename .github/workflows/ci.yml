name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - name: Install (CPU torch, light deps for CI)
        run: |
          pip install --upgrade pip
          pip install ruff pytest numpy scipy
          pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
  no-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block weights and big files
        run: |
          if git ls-files | grep -E '\.(pt|pth|ckpt|safetensors|npy|npz)$'; then echo "weights tracked"; exit 1; fi
          if git ls-files -z | xargs -0 du -k | awk '$1>2048' | grep .; then echo "file >2MB tracked"; exit 1; fi
